# Compiles both firmware images on Windows and macOS on every push, using the
# same flash.py a person would run. Pushing a tag like v1.0 also publishes a
# release whose zip contains the source, flash.py and the prebuilt images, so
# it can be downloaded and flashed without installing a compiler.
name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile both images
        run: python flash.py all --build-only
      - name: Collect images
        shell: bash
        run: |
          mkdir prebuilt
          for board in pico pico_w; do
            cp build/$board/mm_firmware.uf2 prebuilt/mm_firmware_$board.uf2
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.os }}
          path: prebuilt/*.uf2

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-windows-latest
          path: prebuilt
      - name: Publish release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="mm-pico-firmware-${GITHUB_REF_NAME}"
          git archive --format=tar --prefix="$bundle/" HEAD | tar -x
          mkdir "$bundle/prebuilt"
          cp prebuilt/*.uf2 "$bundle/prebuilt/"
          zip -r "$bundle.zip" "$bundle"
          gh release create "$GITHUB_REF_NAME" "$bundle.zip" --generate-notes
